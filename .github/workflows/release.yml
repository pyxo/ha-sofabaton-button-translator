name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest
      - run: ruff check . && ruff format --check .
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('custom_components/sofabaton_button_translator/manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and manifest version differ'
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
